<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6fc2ee" />
    <meta name="color-scheme" content="light only" />
    <meta name="description" content="Unofficial Stardew Valley companion: bundles, villagers, schedules, collections and perfection tracker." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Valley Book" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <title>Valley Book · Stardew Companion</title>
  </head>
  <body>
    <!-- v7.2.2: shown until the app draws (React replaces it). If the app can't start, it offers a reload instead of a blank sky. -->
    <div id="root"><div id="boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;font:600 15px/1.4 system-ui,sans-serif;color:#2e2414;animation:vbboot .3s ease-out .6s both">
      <style>@keyframes vbboot{from{opacity:0}to{opacity:1}}@media (prefers-reduced-motion:reduce){#boot{animation:none!important}}</style>
      <div style="max-width:280px;width:100%;box-sizing:border-box;text-align:center;padding:18px;background:#fff7de;border:3px solid #8a5a2b;border-radius:10px;box-shadow:0 4px 0 #5c3a17">
        <b id="boot-t">Opening Valley Book…</b>
        <button id="boot-b" type="button" onclick="location.reload()" style="display:none;margin:12px auto 0;min-height:44px;padding:8px 20px;font:inherit;font-weight:700;color:inherit;background:#fbebc2;border:2px solid #8a5a2b;border-radius:9px;box-shadow:0 2px 0 #8a5a2b">Tap to reload</button>
      </div>
    </div></div>
    <script>setTimeout(function(){var t=document.getElementById('boot-t'),b=document.getElementById('boot-b');if(t&&b){t.textContent="Valley Book didn't finish loading.";b.style.display='block';}},12000);</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
